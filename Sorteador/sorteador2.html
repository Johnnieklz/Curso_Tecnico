<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sorteador">
            <h1>Sorteador de números</h1>
            <label for="quantidade">Quantidade de números</label>
            <input type="number" id="quantidade" placeholder="">

            <label for="min">Do número</label>
            <input type="number" id="min" placeholder="">

            <label for="max">Até o número</label>
            <input type="number" id="max" placeholder="">

            <div class="buttons">
                <button id="sortear">Sortear</button>
                <button id="reiniciar">Reiniciar</button>
            </div>

            <div class="numeros-sorteados">
                <h3>Números Sorteados</h3>
                <p id="resultado"></p>
            </div>
        </div>
        <div class="meme">
            <img src="img/1_IA/" alt="Meme" />
        </div>
    </div>
</body>
</html>
