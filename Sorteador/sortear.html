<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sorteador">
            <h1>Sorteador de Números</h1>
            <label for="quantidade">Quantidade de Números</label>
            <input type="number" id="quantidade" placeholder="Ex: 5" min="1" />

            <label for="min">Do Número</label>
            <input type="number" id="min" placeholder="Ex: 1" />

            <label for="max">Até o Número</label>
            <input type="number" id="max" placeholder="Ex: 100" />

            <div class="buttons">
                <button id="sortear">Sortear</button>
                <button id="reiniciar">Reiniciar</button>
            </div>

            <div class="numeros-sorteados">
                <h3>Números Sorteados</h3>
                <p id="resultado"></p>
            </div>
        </div>
        <div class="meme">
            <img src="Galeria_de_imagens/2_Internet_das_coisas/café.png" alt="Meme" />
        </div>
    </div>

    <script>
        document.getElementById('sortear').addEventListener('click', function() {
            const quantidade = parseInt(document.getElementById('quantidade').value);
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            const resultado = document.getElementById('resultado');

            // Validação dos inputs
            if (isNaN(quantidade) || isNaN(min) || isNaN(max)) {
                resultado.textContent = 'Por favor, preencha todos os campos.';
                return;
            }

            if (min >= max) {
                resultado.textContent = 'O número mínimo deve ser menor que o máximo.';
                return;
            }

            if (quantidade > (max - min + 1)) {
                resultado.textContent = 'A quantidade de números sorteados não pode exceder o intervalo.';
                return;
            }

            const numerosSorteados = [];
            while (numerosSorteados.length < quantidade) {
                const numero = Math.floor(Math.random() * (max - min + 1)) + min;
                if (!numerosSorteados.includes(numero)) {
                    numerosSorteados.push(numero);
                }
            }

            resultado.textContent = 'Números sorteados: ' + numerosSorteados.join(', ');
        });

        document.getElementById('reiniciar').addEventListener('click', function() {
            document.getElementById('quantidade').value = '';
            document.getElementById('min').value = '';
            document.getElementById('max').value = '';
            document.getElementById('resultado').textContent = '';
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .sorteador {
            margin-right: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .buttons {
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        #sortear {
            background-color: #4a69bd;
            color: white;
        }

        #reiniciar {
            background-color: #7f8c8d;
            color: white;
        }

        .numeros-sorteados h3 {
            margin-top: 20px;
            font-size: 18px;
        }

        .numeros-sorteados p {
            margin-top: 10px;
            font-size: 16px;
        }

        .meme img {
            max-width: 400px; /* Aumentando o tamanho da imagem */
            height: auto;
        }
    </style>
</body>
</html>
